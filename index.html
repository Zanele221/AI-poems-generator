<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poem Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
    <header>
    <h1>Online Poem Generator</h1>
    </header>

    <main>
        <form>
            <input type="text" placeholder="Enter poem topic" autofocus required 
            class="instructions"/>
            <input type="submit" class="submit-button">
        </form>

        <div class="poem">
           Tomorrow, at dawn, at the hour when the countryside whitens, <br/>
           I will depart. You see, I know you wait for me. <br/>
           I will go through the forest and over the mountains. <br/>
        </div>

       
    </main>

    <footer> Coded by <a href="https://github.com/Zanele221" target="_blank">Zanele Qwabe</a> and is <a href="https://github.com/Zanele221/AI-poems-generator" target="_blank">open-sourced on Github</a>
     and is <a href="https://willowy-genie-d77af3.netlify.app/" target="_blank">hosted on Netlify</a>
    </footer>
    </div>
    <script src="./index.js"></script>
</body>
</html>
